[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iroc-datahub"
version = "0.1.0"
description = "IROC data hub: local web app over the iroc_qa data store"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Haoyu Du"}]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "iroc-qa[store] @ git+https://github.com/duwang2015/IROC_QA.git@87d3ffd95ac6019f7ce6989dd3253c03de0113bb",
]

[project.optional-dependencies]
imaging = ["iroc-qa[store,imaging] @ git+https://github.com/duwang2015/IROC_QA.git@87d3ffd95ac6019f7ce6989dd3253c03de0113bb"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "httpx>=0.27,<1"]

[project.scripts]
iroc-datahub = "iroc_datahub.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"iroc_datahub" = ["static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
